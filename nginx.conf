server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx's default mime.types already maps .js and .wasm. Never add a `types {}` block here:
  # it replaces the whole map and breaks JS module loading.
  gzip on;
  gzip_types text/css application/javascript application/wasm application/json;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
